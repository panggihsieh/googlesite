<!DOCTYPE html>

        <h1>學習 × 探究 ×<br><em>創造更好的自己</em></h1>

        <div class="hero-keywords">
          <span>閱讀世界</span>
          <span>探索自然</span>
          <span>擁抱科技</span>
          <span>創造未來</span>
        </div>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#today">開始今天的學習</a>
          <a class="btn btn-ghost" href="#subjects">探索六大主題</a>
        </div>
      </div>

      <aside class="hero-card">

        <p class="hero-card-tagline">閱讀世界　探索自然<br>擁抱科技　創造未來</p>
        <p class="hero-card-en">Da-Nan Elementary School</p>
        <ul class="hero-stats">
          <li><strong>6</strong><span>學習主題</span></li>
          <li><strong>24</strong><span>學習資源</span></li>
          <li><strong>5</strong><span>最新公告</span></li>
        </ul>

    </div>
  </section>

  <section class="section" id="subjects">
    <div class="container">
      <header class="section-head">
        <h2>六大主題入口</h2>
        <p>選一個主題，開始今天的學習</p>
      </header>
      <div class="subject-grid" id="subject-grid"></div>
    </div>
  </section>

  <!-- 今日學習 / 最新消息 / 快速連結 -->
  <section class="section section-soft" id="today" aria-label="今日學習、最新消息與快速連結">
    <div class="container dashboard">
      <div class="panel" id="today-panel"></div>
      <div class="panel" id="news-panel"></div>
      <div class="panel panel-quick" id="quick-panel"></div>
    </div>
  </section>

  <!-- 教師專區 / 關於大南 -->
  <section class="section" id="teacher">
    <div class="container split">
      <div class="info-block" id="teacher-content"></div>
      <div class="info-block" id="about"></div>
    </div>

<div id="site-footer"></div>
