<!-- 網址正規化：/googlesite/index.html 一律顯示成 /googlesite/
     GitHub Pages 沒有伺服器端轉址，因此載入時用 replaceState 改寫網址列（不重新載入）。 -->
<script>
(function () {
  if (!/\/index\.html$/.test(location.pathname)) return;
  try {
    history.replaceState(null, "", location.pathname.replace(/index\.html$/, "") + location.search + location.hash);
  } catch (error) {
    /* 瀏覽器不支援時維持原網址，功能不受影響 */
  }
})();
</script>
</head>
