<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大南老邦教學網｜Google Sites 嵌入首頁</title>
<meta name="description" content="大南國小高年級數位學習：國語、數學、環境教育、AI 科技、學習任務與學生作品。">
<meta name="theme-color" content="#12695b">
<link rel="icon" href="assets/icons/favicon.svg">
<link rel="stylesheet" href="css/embed.css">
</head>
<body>

<main id="main">
  <section class="hero" aria-labelledby="hero-title">
    <a class="admin-entry" href="https://script.google.com/macros/s/AKfycbz2iBSQqlYOeNbuOrDp72FdzFhBhJEk6QocNep7uwkZrN9amNymcU4ENbFkSWd2PjUo/exec" target="_blank" rel="noopener" aria-label="開啟後台管理" title="後台管理">⚙️</a>
    <div class="container">
      <div class="hero-copy">
        <h1 id="hero-title">學習 × 探究 ×</h1>
        <p class="hero-lead" id="hero-lead">大南國小高年級數位學習 × AI × 探究實作</p>
        <div class="hero-keywords" id="hero-keywords" aria-label="學習關鍵字"></div>
      </div>
    </div>
  </section>

  <section class="subjects" aria-label="六大主題入口">
    <div class="container">
      <div class="subject-grid" id="subject-grid"></div>
    </div>
  </section>

  <section class="dashboard-section" aria-label="今日學習、最新消息與快速連結">
    <div class="container dashboard">
      <section class="panel">
        <div class="panel-head">
          <h2>今日學習</h2>
          <span class="panel-meta" id="today-meta"></span>
        </div>
        <ul class="course-list" id="course-list"></ul>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>最新消息</h2>
        </div>
        <ul class="news-list" id="news-list"></ul>
      </section>

      <section class="panel panel-quick">
        <div class="panel-head">
          <h2>快速連結</h2>
        </div>
        <ul class="quick-list" id="quick-list"></ul>
      </section>
    </div>
  </section>
</main>

<noscript>
  <div class="container" style="padding:24px">本頁需要 JavaScript 才能顯示課程與消息。</div>
</noscript>

<script src="data/site-config.js"></script>
<script src="data/subjects.js"></script>
<script src="data/courses.js"></script>
<script src="data/news.js"></script>
<script src="data/links.js"></script>
<script src="data/embed-data.js"></script>
<!-- 後台連線與後台時間同步（publicApiUrl 來自 data/site-config.js） -->
<script src="js/backend.js"></script>
<script src="js/embed.js"></script>
</body>
</html>
