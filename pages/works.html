<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>學生作品 ｜ 大南老邦教學網</title>
<meta name="description" content="大南老邦教學網 — 學生作品：作文精選、專題研究、3D 作品與競賽成果展示。">
<meta name="theme-color" content="#12695b">
<link rel="icon" href="../assets/icons/favicon.svg">

<body data-page="works">

<div id="site-header"></div>

<main id="main">

  <section class="page-hero">
    <div class="container">
      <nav class="breadcrumb" aria-label="路徑">
        <a href="../index.html">首頁</a>
        <span aria-hidden="true">/</span>
        <span>學生作品</span>
      </nav>
      <div class="page-hero-inner" style="--card: #c74f8c">
        <span class="page-hero-icon" aria-hidden="true">🎨</span>
        <div>
          <h1>學生作品</h1>
          <p class="page-hero-sub">作文 • 專題 • 3D 作品 • 作品展示</p>
          <p class="page-hero-intro">把課堂所學變成看得見的作品。每一件作品都附上作者的說明，歡迎觀摩，也歡迎投稿。</p>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <header class="section-head">
        <h2>學習重點</h2>
        <p>本頁四個核心學習區塊</p>

  </section>

  <section class="section section-soft">
    <div class="container">
      <header class="section-head">
        <h2>作品展示</h2>
        <p>依作品類型分類，點擊可看更多</p>
      </header>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <header class="section-head">
        <h2>學習資源</h2>
        <p>點擊即可前往或下載</p>
      </header>
      <ul class="resource-list" id="resource-list"></ul>
    </div>
  </section>

  <section class="section section-soft">
    <div class="container">
      <header class="section-head">
        <h2>本頁任務</h2>
        <p>完成後請於 Google Classroom 繳交</p>
      </header>
      <ul class="task-list" id="task-list"></ul>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <header class="section-head">
        <h2>探索其他主題</h2>
